name: Fix Dungeon Unicode

# Tylko output/StrSheet_Dungeon: &amp;#NNN; → Unicode (+ Elleon).
# Bez Gemini. Commit + audit.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-dungeon-unicode
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unicode w StrSheet_Dungeon
        run: python fix_dungeon_unicode.py --ci

      - name: Audyt po fixie
        run: python audit_full_pack.py --ci
        continue-on-error: true

      - name: Pokaż summary
        if: always()
        run: |
          if [ -f cache/audit_summary.txt ]; then
            cat cache/audit_summary.txt
          else
            echo "Brak summary"
          fi

      - name: Upload raportów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-dungeon-unicode-audit
          path: |
            cache/audit_fr.tsv
            cache/audit_encoding.tsv
            cache/audit_summary.txt
          if-no-files-found: warn

      - name: Zapisz wynik do repozytorium
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/StrSheet_Dungeon/ cache/audit_fr.tsv cache/audit_encoding.tsv \
            cache/audit_summary.txt fix_dungeon_unicode.py || true
          if git diff --staged --quiet; then
            echo "Brak zmian do zapisania."
          else
            git commit -m "Fix StrSheet_Dungeon: decode entities to Unicode (Elleon kept EN)"
            git pull --rebase
            git push
          fi
