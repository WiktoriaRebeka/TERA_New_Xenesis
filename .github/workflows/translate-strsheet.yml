name: Translate TERA StrSheet

# Jedna akcja na WSZYSTKIE pozostale arkusze string= w source/.
# Domyslnie input_path=all — nie trzeba odpalac karty po karcie ani XML po XML.
# Region, ZoneName, Creature, Abnormality i arkusze z wlasnym Action sa pomijane.
on:
  workflow_dispatch:
    inputs:
      input_path:
        description: "all = caly pozostaly source/ naraz. Albo jeden folder, np. source/StrSheet_Achievement"
        required: true
        default: "all"
      start:
        description: "Gdy all: pomin pierwsze N folderow. Gdy jeden folder: pomin N plikow"
        required: false
        default: "0"
      count:
        description: "0 = wszystko. Gdy all: ile folderow w tym jobie"
        required: false
        default: "0"
      batch_size:
        description: "Ile unikalnych stringow na zapytanie Gemini"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: gemini
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Przetlumacz arkusze
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python translate_strsheet.py "${{ inputs.input_path }}" \
            --start "${{ inputs.start }}" \
            --count "${{ inputs.count }}" \
            --batch-size "${{ inputs.batch_size }}"

      - name: Sprawdz jakosc
        if: always()
        continue-on-error: true
        run: |
          path="${{ inputs.input_path }}"
          if [ "$path" = "all" ] || [ "$path" = "source" ]; then
            python check_strsheet.py output --all
          else
            name=$(basename "$path")
            python check_strsheet.py "output/${name}"
          fi

      - name: Zapisz wynik do repozytorium
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output cache || true
          if git diff --staged --quiet; then
            echo "Brak zmian do zapisania."
          else
            git commit -m "Tlumaczenie ${{ inputs.input_path }} start=${{ inputs.start }} count=${{ inputs.count }}"
            git pull --rebase
            git push
          fi
