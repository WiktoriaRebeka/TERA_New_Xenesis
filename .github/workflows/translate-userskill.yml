name: Translate TERA UserSkill

# Caly folder source/StrSheet_UserSkill. name= z tabeli EN (source_en), tooltip po hiszpansku.
on:
  workflow_dispatch:
    inputs:
      input_path:
        description: "Folder source/StrSheet_UserSkill albo jeden XML"
        required: true
        default: "source/StrSheet_UserSkill"
      start:
        description: "Pomin pierwsze N plikow"
        required: false
        default: "0"
      count:
        description: "Ile plikow. 0 = wszystkie"
        required: false
        default: "0"
      batch_size:
        description: "Ile unikalnych tooltipow na zapytanie Gemini"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: gemini
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Przetlumacz UserSkill
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python translate_userskill.py "${{ inputs.input_path }}" \
            --output-dir output/StrSheet_UserSkill \
            --start "${{ inputs.start }}" \
            --count "${{ inputs.count }}" \
            --batch-size "${{ inputs.batch_size }}"

      - name: Sprawdz jakosc
        if: always()
        continue-on-error: true
        run: |
          src="${{ inputs.input_path }}"
          shopt -s nullglob
          for f in output/StrSheet_UserSkill/*_Translated.xml; do
            base=$(basename "$f" _Translated.xml)
            if [ -d "$src" ]; then
              python check_userskill.py "$f" --source "$src/${base}.xml"
            else
              python check_userskill.py "$f" --source "$src"
            fi
          done

      - name: Zapisz wynik do repozytorium
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output cache || true
          if git diff --staged --quiet; then
            echo "Brak zmian do zapisania."
          else
            git commit -m "Tlumaczenie UserSkill pack start=${{ inputs.start }} count=${{ inputs.count }}"
            git pull --rebase
            git push
          fi
