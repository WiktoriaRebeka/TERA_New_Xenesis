name: Fix remaining French leftovers

# Bez Gemini. Przywraca SE/EN po ID (data/fr_restore_map.json) + frazy dialogów.
# Cel: fr_hits → 0 w output/. Commit + audit.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-remaining-fr
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Napraw pozostałe FR w output/
        run: python fix_remaining_fr.py --ci

      - name: Audyt po fixie
        run: python audit_full_pack.py --ci
        continue-on-error: true

      - name: Pokaż summary
        if: always()
        run: |
          if [ -f cache/audit_summary.txt ]; then
            cat cache/audit_summary.txt
          else
            echo "Brak summary"
          fi

      - name: Upload raportów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-remaining-fr-audit
          path: |
            cache/audit_fr.tsv
            cache/audit_encoding.tsv
            cache/audit_summary.txt
          if-no-files-found: warn

      - name: Zapisz wynik do repozytorium
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ cache/audit_fr.tsv cache/audit_encoding.tsv cache/audit_summary.txt \
            fix_remaining_fr.py data/fr_restore_map.json || true
          if git diff --staged --quiet; then
            echo "Brak zmian do zapisania."
          else
            git commit -m "Fix remaining French leftovers in output/ (SE/EN restore by ID)"
            git pull --rebase
            git push
          fi
